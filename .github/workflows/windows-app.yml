name: Build Windows app
on:
  workflow_dispatch:
  push:
    tags: ['soundform-v*']
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            soundform/requirements.txt
            packaging/requirements-build.txt
      - name: Install build dependencies
        run: python -m pip install -r packaging/requirements-build.txt
      - name: Test source
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          python -m pytest soundform/tests -q
      - name: Build and check executable
        run: python packaging/build_windows.py
      - name: Upload portable app
        uses: actions/upload-artifact@v4
        with:
          name: Soundform-Windows-x64
          path: |
            dist/Soundform-Windows-x64.zip
            dist/Soundform-Windows-x64.zip.sha256
            dist/smoke-test.json
          if-no-files-found: error

