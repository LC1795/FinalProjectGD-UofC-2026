name: Build Windows app
on:
  workflow_dispatch:
  push:
    tags: ['soundform-v*']
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            soundform/requirements.txt
            packaging/requirements-build.txt
      - name: Install build dependencies
        run: python -m pip install -r packaging/requirements-build.txt
      - name: Test source
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          python -m pytest soundform/tests -q
      - name: Build and check executable
        run: python packaging/build_windows.py
      - name: Check installed app and uninstaller
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'SoundForm V2.0'
          $installer = Start-Process dist/SoundForm-V2.0-Setup-x64.exe -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=`"$target`"" -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw "Installer exited with code $($installer.ExitCode)." }
          try {
            $report = Join-Path $env:RUNNER_TEMP 'soundform-installed-smoke.json'
            $app = Start-Process (Join-Path $target 'Soundform.exe') -ArgumentList "--smoke-test `"$report`"" -WorkingDirectory $env:RUNNER_TEMP -Wait -PassThru
            if ($app.ExitCode -ne 0 -or -not (Get-Content $report | ConvertFrom-Json).ok) {
              throw "The installed app failed its launch check."
            }
          } finally {
            $uninstall = Start-Process (Join-Path $target 'unins000.exe') -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -Wait -PassThru
            if ($uninstall.ExitCode -ne 0 -or (Test-Path (Join-Path $target 'Soundform.exe'))) {
              throw "The uninstall check failed."
            }
          }
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: SoundForm-V2.0-Windows-x64
          path: |
            dist/SoundForm-V2.0-Windows-x64.zip
            dist/SoundForm-V2.0-Windows-x64.zip.sha256
            dist/SoundForm-V2.0-Setup-x64.exe
            dist/smoke-test.json
          if-no-files-found: error

